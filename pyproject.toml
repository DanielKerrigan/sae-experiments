[project]
authors = [{ name = "DanielKerrigan", email = "d.kerrigan111@gmail.com" }]
description = "Sparse autoencoder experiments"
name = "saeexperiments"
requires-python = ">= 3.10"
version = "0.1.0"
dependencies = [
    "saefarer @ git+https://github.com/DanielKerrigan/saefarer.git@c003dd9",
    "jupyterlab==4.3.4",
    "transformer-lens==2.11.0",
    "sae-lens==5.3.3",
    "datasets==2.21.0",
    "transformers==4.48.1",
    "torch==2.5.1",
    "altair[all]==5.5.0",
    "polars==1.21.0",
    "openpyxl==3.1.5",
]

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.pixi.project]
channels = ["conda-forge"]
platforms = ["osx-arm64", "linux-64"]

[tool.pixi.pypi-dependencies]
saeexperiments = { path = ".", editable = true }

[tool.pixi.tasks]

[tool.pixi.system-requirements]
linux = "3.10.0"
libc = { family = "glibc", version = "2.17" }

[tool.pixi.dependencies]
python = "3.10.*"
nodejs = ">=22.6.0,<22.14"
ruff = ">=0.9.3,<0.10"

[tool.ruff]
extend-include = ["*.ipynb"]
